volumes:
  etc_amnezia_wg:
    name: amnezia_wg_data

services:
  amnezia-wg-easy:
    image: phungvanquy/amneziawg:v1.1
    container_name: amnezia-wg-easy
    restart: unless-stopped
    
    env_file:
      - .env
    
    environment:
      - PASSWORD_HASH=${PASSWORD_HASH}
      # Дополнительные переменные (раскомментируйте при необходимости)
      # - WG_HOST=${WG_HOST}
      # - WG_SUBNET=${WG_SUBNET:-10.8.0.0/24}
      # - WG_ALLOWED_IPS=${WG_ALLOWED_IPS:-0.0.0.0/0}
      # - WG_DNS=${WG_DNS:-1.1.1.1}
      # - WG_PERSISTENT_KEEPALIVE=${WG_PERSISTENT_KEEPALIVE:-25}
      # - WG_MTU=${WG_MTU:-1420}
      # - TZ=${TZ:-UTC}
    
    volumes:
      - etc_amnezia_wg:/etc/amnezia/amneziawg
    
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
      - "${PORT}:${PORT}/tcp"
    
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    
    devices:
      - /dev/net/tun:/dev/net/tun
    
    networks:
      - amnezia_network

networks:
  amnezia_network:
    name: amnezia_network
    driver: bridge