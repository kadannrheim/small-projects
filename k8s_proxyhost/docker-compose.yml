# Запуск jump/proxy host: SSH-доступ + kubectl + GitLab Runner (shell)
services:
  k8s-bastion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Пин версий и вкл/выкл тяжёлых инструментов (быстрее и легче пересборка)
        INSTALL_K9S: ${INSTALL_K9S:-true}
        INSTALL_HELM: ${INSTALL_HELM:-true}
        KUBECTL_VERSION: ${KUBECTL_VERSION:-v1.30.4}
        HELM_VERSION: ${HELM_VERSION:-v3.15.4}
        K9S_VERSION: ${K9S_VERSION:-v0.32.5}
        GITLAB_RUNNER_VERSION: ${GITLAB_RUNNER_VERSION:-v17.3.1}
    container_name: ${CONTAINER_NAME:-k8s-proxyhost}
    hostname: ${CONTAINER_NAME:-k8s-proxyhost}
    restart: unless-stopped
    ports:
      # Хост:контейнер — SSH снаружи на SSH_PORT (по умолчанию 2222)
      - "${SSH_PORT:-2222}:22"
    volumes:
      # Публичные SSH-ключи → файл /config/authorized_keys
      - ${SSH_KEYS_PATH:-./folder_with_sshkey}:/config:ro
      # kubeconfig (файл, не каталог), только чтение
      - ${KUBECONFIG_PATH:-./kubeconfig/config}:/root/.kube/config:ro
      # Рабочие каталоги для скриптов и манифестов
      - ${SCRIPTS_PATH:-./scripts}:/root/scripts
      - ${MANIFESTS_PATH:-./manifests}:/root/manifests
      # Сохраняет регистрацию runner между перезапусками
      # Чтобы перерегистрировать: FORCE_REREGISTER=true или удалить этот volume
      - gitlab-runner-config:/etc/gitlab-runner
    environment:
      TZ: ${TIMEZONE:-UTC}
      KUBECONFIG: /root/.kube/config
      TERM: xterm-256color
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_RUNNER_TOKEN_SHELL: ${GITLAB_RUNNER_TOKEN_SHELL:-}
      GITLAB_RUNNER_NAME: ${GITLAB_RUNNER_NAME:-shell-on-k8s-proxyhost}
      # Теги / locked / run-untagged задаются в UI GitLab при создании runner (glrt-)
      FORCE_REREGISTER: ${FORCE_REREGISTER:-false}
      SSH_PORT: ${SSH_PORT:-2222}
      # Если задан — только предупреждение в логах; docker executor не поддерживается
      GITLAB_RUNNER_TOKEN_DOCKER: ${GITLAB_RUNNER_TOKEN_DOCKER:-}
    # Лимиты ресурсов (Compose применяет напрямую, не только в Swarm)
    cpus: ${CPU_LIMIT:-0.5}
    mem_limit: ${MEMORY_LIMIT:-512m}
    mem_reservation: ${MEMORY_RESERVATION:-128m}
    networks:
      - k8s-network
    healthcheck:
      # Контейнер жив, если работает sshd
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # Persistent-конфиг GitLab Runner (config.toml)
  gitlab-runner-config:

networks:
  k8s-network:
    driver: bridge
