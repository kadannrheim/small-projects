services:
  k8s-bastion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
    container_name: ${CONTAINER_NAME:-k8s-proxyhost}
    hostname: ${CONTAINER_NAME:-k8s-proxyhost}
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      # SSH ключи
      - ${SSH_KEYS_PATH:-./folder_with_sshkey}:/config:ro
      # Kubernetes конфиг
      - ${KUBECONFIG_PATH:-./kubeconfig/config}:/root/.kube/config
      # История bash
      - bash_history:/root/.bash_history
      # Скрипты и манифесты
      - ./scripts:/root/scripts:ro
      - ./manifests:/root/manifests:ro
      # GitLab Runner конфиг (persistent)
      - gitlab-runner-config:/etc/gitlab-runner
      # Docker (опционально, только если USE_HOST_DOCKER=true)
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - TZ=${TIMEZONE:-UTC}
      - KUBECONFIG=/root/.kube/config
      - TERM=xterm-256color
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_RUNNER_TOKEN_SHELL=${GITLAB_RUNNER_TOKEN_SHELL:-}
      - GITLAB_RUNNER_TOKEN_DOCKER=${GITLAB_RUNNER_TOKEN_DOCKER:-}
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - k8s-network
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-0.8}'
          memory: ${MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${CPU_RESERVATION:-0.2}'
          memory: ${MEMORY_RESERVATION:-256M}
    privileged: ${USE_HOST_DOCKER:-true}

volumes:
  bash_history:
  gitlab-runner-config:

networks:
  k8s-network:
    driver: bridge